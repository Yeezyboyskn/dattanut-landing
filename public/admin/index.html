<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel de edición · DATTANUT</title>
  <link rel="icon" href="/logo-mark.png" type="image/png">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <style>
    html, body { margin: 0; background: #0c0b08; }
    body, button, input, textarea, select { font-family: Inter, system-ui, -apple-system, sans-serif; }
    #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0c0b08; }
    #boot div { text-align: center; }
    #boot img { width: 88px; height: 88px; opacity: .95; animation: pulse 1.6s ease-in-out infinite; }
    #boot p { color: #8a8374; font-size: .9rem; margin: 14px 0 0; letter-spacing: .02em; }
    #boot p small { display: block; margin-top: 4px; color: #57513f; font-size: .78rem; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div>
      <img src="/logo-mark.png" alt="">
      <p>Panel de edición DATTANUT<small>Preparando todo…</small></p>
    </div>
  </div>
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js?client_id=Ov23liLW2FdIAlW06859"></script>
  <script src="preview.js"></script>
  <script>
    window.addEventListener('load', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
</body>
</html>
